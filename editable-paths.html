<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vector Tracer</title>
  <style>
    :root {
      color-scheme: dark;
      --surface: #121518;
      --surface-strong: #1f242c;
      --border: rgba(255,255,255,.08);
      --text: #f1f2f5;
      --muted: #9aa1b3;
      --accent: #84d89d;
      --shadow: 0 24px 80px rgba(0,0,0,.35);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top, rgba(132,216,157,.12), transparent 28%),
                linear-gradient(180deg, #07080b 0%, #0b0d10 100%);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 32px;
    }

    main {
      width: min(1120px, 100%);
      display: grid;
      gap: 24px;
    }

    header {
      text-align: center;
      max-width: 760px;
      margin: 0 auto;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.5rem, 4vw, 4rem);
      letter-spacing: -0.04em;
      line-height: 1;
    }

    p.lead {
      margin: 18px auto 0;
      color: var(--muted);
      line-height: 1.7;
      max-width: 680px;
      font-size: 1.05rem;
    }

    .panel {
      background: rgba(18,21,24,.95);
      border: 1px solid rgba(255,255,255,.07);
      box-shadow: var(--shadow);
      border-radius: 28px;
      overflow: hidden;
      padding: 24px;
    }

    .dropzone {
      border: 2px dashed rgba(132,216,157,.45);
      border-radius: 22px;
      min-height: 320px;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 32px;
      transition: background .2s ease, border-color .2s ease;
      background: rgba(132,216,157,.02);
    }

    .dropzone.dragover {
      background: rgba(132,216,157,.12);
      border-color: rgba(132,216,157,.8);
    }

    .dropzone strong {
      display: block;
      font-size: 1.3rem;
      margin-bottom: 10px;
    }

    .dropzone span { color: var(--muted); }

    .controls {
      display: grid;
      gap: 16px;
      grid-template-columns: 1fr;
    }

    .control-row {
      display: flex;
      gap: 14px;
      align-items: center;
      flex-wrap: wrap;
    }

    .control-row label {
      min-width: 100px;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .control-row input[type='range'] { flex: 1; }

    .control-row output {
      width: 45px;
      text-align: right;
      color: var(--text);
      font-variant-numeric: tabular-nums;
    }

    .actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    button {
      border: none;
      cursor: pointer;
      border-radius: 14px;
      padding: 14px 18px;
      background: linear-gradient(135deg, #84d89d 0%, #c7f0b5 100%);
      color: #111;
      font-weight: 700;
      transition: transform .16s ease, filter .16s ease;
    }

    button:hover { transform: translateY(-1px); filter: brightness(1.02); }

    button.secondary {
      background: rgba(255,255,255,.06);
      color: var(--text);
    }

    .preview-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(320px, 420px);
      gap: 20px;
    }

    .preview-card {
      border-radius: 24px;
      background: #0f1318;
      border: 1px solid rgba(255,255,255,.06);
      padding: 18px;
      display: grid;
      gap: 16px;
    }

    .preview-card h2 {
      margin: 0;
      font-size: 1rem;
      letter-spacing: .01em;
    }

    .preview-box {
      background: #0b0d10;
      border-radius: 20px;
      min-height: 320px;
      overflow: hidden;
      position: relative;
      border: 1px solid rgba(255,255,255,.05);
    }

    .preview-box canvas,
    .preview-box svg {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
      background: transparent;
    }

    .meta {
      display: grid;
      gap: 8px;
      font-size: 0.94rem;
    }

    .meta div { color: var(--muted); }

    pre {
      margin: 0;
      overflow: auto;
      max-height: 240px;
      padding: 16px;
      border-radius: 18px;
      background: rgba(255,255,255,.04);
      color: #d6d9e0;
    }

    @media (max-width: 840px) {
      body { padding: 20px; }
      .preview-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Vector Tracer</h1>
      <p class="lead">Trace a photo into high-detail, editable SVG paths with VTracer.</p>
    </header>

    <section class="panel">
      <div class="dropzone" id="dropzone">
        <div>
          <strong>Drop your image here</strong>
          <span>or click to choose a file, paste an image, or drag and drop.</span>
        </div>
      </div>

      <div class="controls">
        <div class="control-row">
          <label for="qualityRange">Fidelity target</label>
          <input id="qualityRange" type="range" min="50" max="95" step="5" value="85" />
          <output id="qualityValue">85%</output>
        </div>
        <div class="actions">
          <button id="processButton">Trace image</button>
          <button type="button" class="secondary" id="downloadButton">Download SVG</button>
          <button type="button" class="secondary" id="copyButton">Copy SVG</button>
        </div>
      </div>
    </section>

    <div class="preview-grid">
      <article class="preview-card">
        <h2>Input preview</h2>
        <div class="preview-box" id="inputPreview"></div>
        <div class="meta" id="inputMeta"><div>No image loaded yet.</div></div>
      </article>

      <article class="preview-card">
        <h2>Editable path output</h2>
        <div class="preview-box" id="svgPreview"></div>
        <div class="meta" id="svgMeta"><div>Editable SVG paths appear here.</div></div>
      </article>
    </div>

    <section class="panel">
      <h2>SVG source</h2>
      <pre id="svgSource">&lt;svg&gt;...&lt;/svg&gt;</pre>
    </section>
  </main>

  <script>
    const dropzone = document.getElementById('dropzone');
    const inputPreview = document.getElementById('inputPreview');
    const svgPreview = document.getElementById('svgPreview');
    const svgSource = document.getElementById('svgSource');
    const inputMeta = document.getElementById('inputMeta');
    const svgMeta = document.getElementById('svgMeta');
    const qualityRange = document.getElementById('qualityRange');
    const qualityValue = document.getElementById('qualityValue');
    const processButton = document.getElementById('processButton');
    const downloadButton = document.getElementById('downloadButton');
    const copyButton = document.getElementById('copyButton');

    let activeImage = null;
    let lastSvg = '';
    let vTracerModule = null;
    let processingVersion = 0;

    qualityValue.textContent = `${qualityRange.value}%`;
    qualityRange.addEventListener('input', () => qualityValue.textContent = `${qualityRange.value}%`);

    dropzone.addEventListener('click', () => {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = 'image/png, image/jpeg, image/jpg';
      input.onchange = () => {
        if (input.files?.[0]) loadFile(input.files[0]);
      };
      input.click();
    });

    ['dragenter', 'dragover'].forEach(eventName => {
      dropzone.addEventListener(eventName, event => {
        event.preventDefault();
        event.stopPropagation();
        dropzone.classList.add('dragover');
      });
    });

    ['dragleave', 'drop'].forEach(eventName => {
      dropzone.addEventListener(eventName, event => {
        event.preventDefault();
        event.stopPropagation();
        dropzone.classList.remove('dragover');
      });
    });

    dropzone.addEventListener('drop', event => {
      const file = event.dataTransfer?.files?.[0];
      if (file) loadFile(file);
    });

    window.addEventListener('paste', event => {
      const items = Array.from(event.clipboardData?.items || []);
      const imageItem = items.find(item => item.type.startsWith('image/'));
      if (!imageItem) return;
      const file = imageItem.getAsFile();
      if (file) loadFile(file);
    });

    processButton.addEventListener('click', () => {
      if (!activeImage) return alert('Load an image first.');
      void traceImage(activeImage);
    });

    downloadButton.addEventListener('click', () => {
      if (!lastSvg) return alert('Generate an SVG first.');
      const blob = new Blob([lastSvg], { type: 'image/svg+xml' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = 'editable-vector-paths.svg';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
    });

    copyButton.addEventListener('click', async () => {
      if (!lastSvg) return alert('Generate an SVG first.');
      try {
        await navigator.clipboard.writeText(lastSvg);
        alert('SVG copied to clipboard.');
      } catch (error) {
        alert('Copy failed. Use the SVG source box instead.');
      }
    });

    function loadFile(file) {
      if (!file.type.startsWith('image/')) return alert('Please select an image file.');
      const reader = new FileReader();
      reader.onload = () => {
        const image = new Image();
        image.onload = () => {
          activeImage = image;
          renderInputPreview(image, file);
          void traceImage(image);
        };
        image.src = reader.result;
      };
      reader.readAsDataURL(file);
    }

    function renderInputPreview(image, file) {
      inputPreview.innerHTML = '';
      const canvas = document.createElement('canvas');
      const context = canvas.getContext('2d');
      const maxDimension = 880;
      const ratio = Math.min(1, maxDimension / Math.max(image.naturalWidth || image.width, image.naturalHeight || image.height));
      canvas.width = Math.round((image.naturalWidth || image.width) * ratio);
      canvas.height = Math.round((image.naturalHeight || image.height) * ratio);
      context.drawImage(image, 0, 0, canvas.width, canvas.height);
      inputPreview.appendChild(canvas);
      inputMeta.innerHTML = `<div>${file.name}</div><div>Size: ${image.naturalWidth || image.width}x${image.naturalHeight || image.height}px</div><div>Loaded for path tracing</div>`;
    }

    async function traceImage(image) {
      const version = ++processingVersion;
      setStatus('Tracing...');
      try {
        const result = await traceWithVTracer(image, Number(qualityRange.value));
        if (version !== processingVersion) return;
        lastSvg = result.svg;
        svgSource.textContent = result.svg;
        renderSvgPreview(result.svg);
        svgMeta.innerHTML = result.meta;
      } catch (error) {
        if (version !== processingVersion) return;
        console.error(error);
        svgPreview.innerHTML = '';
        svgMeta.innerHTML = '<div>Tracing failed. Try a smaller image or reload the page.</div>';
      } finally {
        if (version === processingVersion) setStatus('Ready');
      }
    }

    async function traceWithVTracer(image, qualityTarget) {
      const traceProfiles = {
        50: { maxDimension: 1024, colorPrecision: 4, layerDifference: 32, filterSpeckle: 64, cornerThreshold: 80, lengthThreshold: 4.5, maxIterations: 10, spliceThreshold: 45, pathPrecision: 2 },
        55: { maxDimension: 1536, colorPrecision: 5, layerDifference: 24, filterSpeckle: 32, cornerThreshold: 75, lengthThreshold: 4, maxIterations: 12, spliceThreshold: 40, pathPrecision: 2 },
        60: { maxDimension: 2048, colorPrecision: 5, layerDifference: 16, filterSpeckle: 16, cornerThreshold: 70, lengthThreshold: 3.75, maxIterations: 14, spliceThreshold: 35, pathPrecision: 3 },
        65: { maxDimension: 2560, colorPrecision: 6, layerDifference: 12, filterSpeckle: 8, cornerThreshold: 65, lengthThreshold: 3.5, maxIterations: 16, spliceThreshold: 32, pathPrecision: 3 },
        70: { maxDimension: 3072, colorPrecision: 6, layerDifference: 8, filterSpeckle: 4, cornerThreshold: 60, lengthThreshold: 3.25, maxIterations: 18, spliceThreshold: 30, pathPrecision: 3 },
        75: { maxDimension: 3584, colorPrecision: 6, layerDifference: 6, filterSpeckle: 2, cornerThreshold: 55, lengthThreshold: 3, maxIterations: 20, spliceThreshold: 28, pathPrecision: 3 },
        80: { maxDimension: 3840, colorPrecision: 7, layerDifference: 4, filterSpeckle: 1, cornerThreshold: 52, lengthThreshold: 2.75, maxIterations: 20, spliceThreshold: 25, pathPrecision: 4 },
        85: { maxDimension: 4096, colorPrecision: 7, layerDifference: 2, filterSpeckle: 0, cornerThreshold: 50, lengthThreshold: 2.5, maxIterations: 20, spliceThreshold: 22, pathPrecision: 4 },
        90: { maxDimension: 4608, colorPrecision: 8, layerDifference: 1, filterSpeckle: 0, cornerThreshold: 45, lengthThreshold: 2.25, maxIterations: 24, spliceThreshold: 20, pathPrecision: 4 },
        95: { maxDimension: 5120, colorPrecision: 8, layerDifference: 1, filterSpeckle: 0, cornerThreshold: 40, lengthThreshold: 2, maxIterations: 24, spliceThreshold: 18, pathPrecision: 5 }
      };
      const profile = traceProfiles[qualityTarget] || traceProfiles[85];
      const imageWidth = image.naturalWidth || image.width;
      const imageHeight = image.naturalHeight || image.height;
      const scale = Math.min(1, profile.maxDimension / Math.max(imageWidth, imageHeight));
      const width = Math.max(24, Math.round(imageWidth * scale));
      const height = Math.max(24, Math.round(imageHeight * scale));
      const canvas = document.createElement('canvas');
      const context = canvas.getContext('2d', { willReadFrequently: true });
      canvas.width = width;
      canvas.height = height;
      context.drawImage(image, 0, 0, width, height);
      const imageData = context.getImageData(0, 0, width, height);
      const tracer = await loadVTracer();
      const pixels = new Uint8Array(imageData.data.buffer, imageData.data.byteOffset, imageData.data.byteLength);
      const svg = tracer.to_svg(pixels, width, height, {
        binary: false,
        mode: 'spline',
        hierarchical: 'stacked',
        cornerThreshold: profile.cornerThreshold,
        lengthThreshold: profile.lengthThreshold,
        maxIterations: profile.maxIterations,
        spliceThreshold: profile.spliceThreshold,
        filterSpeckle: profile.filterSpeckle,
        colorPrecision: profile.colorPrecision,
        layerDifference: profile.layerDifference,
        pathPrecision: profile.pathPrecision
      });
      const pathCount = (svg.match(/<path\b/g) || []).length;
      return {
        svg,
        meta: `<div>SVG size: ${width}x${height} viewBox</div><div>${pathCount} editable spline paths generated</div><div>${qualityTarget}% fidelity target</div>`
      };
    }

    async function loadVTracer() {
      if (!vTracerModule) {
        vTracerModule = import('./vtracer.js').then(async module => {
          await module.default({ module_or_path: new URL('./vtracer.wasm', window.location.href) });
          return module;
        }).catch(error => {
          vTracerModule = null;
          throw error;
        });
      }
      return vTracerModule;
    }

    function setStatus(message) {
      processButton.textContent = message === 'Tracing...' ? 'Tracing...' : 'Trace image';
    }

    function renderSvgPreview(svg) {
      svgPreview.innerHTML = svg;
      const svgNode = svgPreview.querySelector('svg');
      if (svgNode) {
        svgNode.style.width = '100%';
        svgNode.style.height = '100%';
      }
    }
  </script>
</body>
</html>
